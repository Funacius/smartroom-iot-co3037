[platformio]
default_envs = sensor, bridge

[env]
platform = espressif32@6.13.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    robtillaart/DHT20@0.3.2

[env:sensor]
build_flags = ${env.build_flags} -D ROLE_SENSOR=1

[env:bridge]
build_flags = ${env.build_flags} -D ROLE_SENSOR=0
